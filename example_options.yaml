name: DThaiPome_PMW2RP
description: YAML generated by Archipelago 0.6.7.
game: Pac-Man World 2 Re-Pac
Pac-Man World 2 Re-Pac:
  # disabled, normal, extreme OR [0,99]
  progression_balancing: normal
  # minimal or full
  accessibility: minimal
  
  # Goal Boss: spooky or toc_man
  #
  # Determines which boss fight has the goal, and also determines how many levels have locations with items.
  #
  # Spooky:
  #   * Goal is completed after defeating Spooky. Only Present Era levels are have locations with items.
  #   * Spooky is accessible after receiving all 5 of the Golden Fruit. If level randomization is enabled, you must additionally receive access to Spooky.
  # Toc-Man:
  #   * Goal is completed after defeating Toc-Man. All Present Era and Pac-Knight levels have locations with items.
  #   * Toc-Man is accessible after completing the above requirements to defeat Spooky, and then also receiving all 5 Pac-Knight Era Keys. If level randomization is enabled, you must additionally receive access to Flying Dark Shadow.
  goal_boss: toc_man

  # Gold Medal Checks: If enabled, beating Gold Medal time trial times will send items.
  gold_medal_checks: true

  # Level Randomizer:
  #   * When disabled, worlds will be unlocked by receiving Golden Fruit or Pac-Knight Era Keys. You will be able to progress through each world individually by beating levels in sequence.
  #   * When enabled, each level will become an item in the multiworld. You will unlock access to individual levels by receiving their item. Clearing levels will NOT unlock the level that comes after.
  level_randomizer: true

  # Random Starting Levels: If Level Randomizer is unlock, this is how many levels you will have access to at the very start.
  random_starting_levels: 3

  # Move Randomizer:
  # When enabled, elements of Pac-Man's moveset will be disabled until you receive them as items.
  # Super Butt Bounce will be unlocked when you have both Progressive Butt Bounce items.
  # Super Dolphin Kick will be unlocked when you have both Progressive Dolphin Kick items.
  move_randomizer: true

  # Moves to Randomize: If Move Randomizer is enabled, the moves listed here will NOT be available at the start, and will need to be received.
  moves_to_randomize:
  # - Butt Bounce (uncomment if you want this randomized but I don't recommend it haha)
  - Super Dolphin Kick
  - Super Butt Bounce
  - Rev Roll
  - Pac-Dot Attack
  - Flutter
  - Flip Kick
  - Dolphin Kick

  # Logic Difficulty: fairy_mode, adventure_mode, anything_goes
  #
  # Determines what kind of gameplay will be required to beat the seed.
  #
  # (Note: This setting is unrelated to your save file difficulty. This world's logic is balanced around Adventure Mode, but Fairy Mode is equally playable and may allow some extra locations to be cleared.)
  #
  # Fairy Mode: Good for beginners. Basic gameplay skills are required to clear all locations.
  # Adventure Mode: More challenging logic. Requires niche knowledge of Pac-Man's capabilities, as well as some tricks and glitches used commonly in speedruns of this game.
  # Anything Goes: Completion may require you to execute incredibly difficult and frustrating tricks. Pick this if you want to have a bad time.
  logic_difficulty: adventure_mode

  # Fruit Switches: If enabled, all fruit will be removed from the game until you collect matching fruit switches.
  # Each kind of fruit will have a corresponding fruit switch. Collecting it will enable only that type of fruit to be collected in levels.
  fruit_switches: true

  # Exclude Goal Locations: If enabled, important items will not appear in Spooky, Legendary Story, and Flying Dark Shadow.
  # If Spooky is the goal boss, the Pac-Village fruits mission will also not give anything important.
  exclude_goal_locations: true

  # Filler item weights: Configure these to make certain items appear more or less frequently.
  pac_dot_weight: 30
  points_weight: 55
  lives_weight: 10
  trap_weight: 5

  # Other common AP settings
  local_items: []
  non_local_items: []
  start_inventory: {}
  start_hints: []
  start_location_hints: []
  exclude_locations: []
  priority_locations: []
